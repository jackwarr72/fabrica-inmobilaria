services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: centinela
      POSTGRES_PASSWORD: centinela_dev
      POSTGRES_DB: centinela
    ports:
      - "5433:5432"
    volumes:
      - centinela_pgdata:/var/lib/postgresql/data

volumes:
  centinela_pgdata:
